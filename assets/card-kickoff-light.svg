<svg xmlns="http://www.w3.org/2000/svg" width="414" height="248" viewBox="0 0 414 248" role="img" aria-label="kickoff — Live football scoreboard in the terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fb"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="kickoffGlow" cx="0.5" cy="0.14" r="0.58">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="414" height="248" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="413" height="247" rx="13" fill="url(#bg)" stroke="#d5dce5" stroke-width="1"/>
    <rect width="414" height="248" fill="url(#kickoffGlow)"/>
    <line x1="18" y1="1.2" x2="396" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Upper miniature scoreboard stage -->
    <rect x="18" y="18" width="378" height="102" rx="9" fill="#f1f4f8" stroke="#dce2ea" stroke-width="1"/>
    <circle cx="32" cy="33" r="3" fill="#dc2626">
      <animate attributeName="opacity" values="1;0.28;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="41" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700" letter-spacing="1.4" fill="#dc2626">LIVE</text>
    <text x="207" y="36" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="500" letter-spacing="1.2" fill="#64748b">MATCH CENTER</text>
    <text x="382" y="36" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" fill="#059669">67&#x2032;</text>

    <text x="142" y="75" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="0.8" fill="#475569">RMA</text>
    <text x="207" y="79" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="26" font-weight="700" fill="#0f172a">2 - 1</text>
    <text x="272" y="75" text-anchor="start" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" letter-spacing="0.8" fill="#475569">MCI</text>

    <text x="32" y="104" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="600" fill="#059669">58%</text>
    <rect x="62" y="99" width="290" height="4" rx="2" fill="#e4e8ef"/>
    <rect x="62" y="99" width="168" height="4" rx="2" fill="#059669"/>
    <text x="382" y="104" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="500" fill="#64748b">42%</text>

    <!-- Lower editorial -->
    <text x="22" y="146" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" letter-spacing="1.3" fill="#64748b">
      <tspan fill="#059669" font-weight="600">02</tspan>&#160;&#160;/&#160;&#160;LIVE SCORES
    </text>
    <path d="M380 146 L390 136 M382 136 L390 136 L390 144" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="22" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" letter-spacing="-0.4" fill="#0f172a">kickoff</text>
    <text x="22" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569">Live football scoreboard, timelines, and team stats.</text>

    <line x1="22" y1="214" x2="392" y2="214" stroke="#e4e8ef" stroke-width="1"/>
    <text x="22" y="234" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#64748b">~28 MB RAM&#160;&#160;&#x00b7;&#160;&#160;15s Sync&#160;&#160;&#x00b7;&#160;&#160;mpv&#160;&#160;&#x00b7;&#160;&#160;Cross-Platform</text>
  </g>
</svg>
