<svg xmlns="http://www.w3.org/2000/svg" width="848" height="204" viewBox="0 0 848 204" role="img" aria-label="Zenova — Cross-platform media streaming platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d4557" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3d4557" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#3d4557" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3d4557" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="zenovaGlow" cx="0.85" cy="0.2" r="0.45">
      <stop offset="0%" stop-color="#f0a640" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#f0a640" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="848" height="204" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="847" height="203" rx="13" fill="url(#bg)" stroke="#232833" stroke-width="1"/>
    <rect width="848" height="204" fill="url(#zenovaGlow)"/>
    <line x1="24" y1="1.2" x2="824" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Left editorial -->
    <text x="30" y="34" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#6c7482">
      <tspan fill="#f0a640" font-weight="600">04</tspan>&#160;&#160;/&#160;&#160;STREAMING PLATFORM
    </text>
    <path d="M374 34 L384 24 M376 24 L384 24 L384 32" fill="none" stroke="#6c7482" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="30" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#f3f4f6">Zenova</text>

    <text x="30" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">Cross-platform media streaming platform.</text>
    <text x="30" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">HMAC-signed HLS proxy with hop-by-hop SSRF</text>
    <text x="30" y="139" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">validation, serverless sync, and native TV apps.</text>

    <line x1="30" y1="160" x2="384" y2="160" stroke="#1b2029" stroke-width="1"/>
    <text x="30" y="182" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#6c7482">Web&#160;&#160;&#x00b7;&#160;&#160;Android TV&#160;&#160;&#x00b7;&#160;&#160;LG webOS&#160;&#160;&#x00b7;&#160;&#160;Samsung Tizen</text>

    <!-- Right multi-screen broadcast schematic -->
    <rect x="410" y="20" width="416" height="164" rx="10" fill="#090b0f" stroke="#1f242e" stroke-width="1"/>

    <!-- TV / player viewport -->
    <rect x="426" y="35" width="212" height="122" rx="7" fill="#11141c" stroke="#232833" stroke-width="1"/>
    <rect x="504" y="163" width="56" height="3" rx="1.5" fill="#3e4554" opacity="0.65"/>

    <rect x="438" y="45" width="114" height="18" rx="4" fill="#f0a640" fill-opacity="0.12" stroke="#f0a640" stroke-opacity="0.35" stroke-width="1"/>
    <text x="495" y="57" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.8" fill="#f0a640">HLS &#x00b7; HMAC SIGNED</text>

    <circle cx="532" cy="94" r="15" fill="#f0a640" fill-opacity="0.14" stroke="#f0a640" stroke-opacity="0.7" stroke-width="1.2"/>
    <path d="M528.5 88.5 L538 94 L528.5 99.5 Z" fill="#f0a640"/>

    <text x="626" y="131" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8" font-weight="500" fill="#6c7482">4K &#x00b7; ZERO ADS</text>
    <rect x="438" y="139" width="188" height="3.5" rx="1.75" fill="#1b2029"/>
    <rect x="438" y="139" width="84" height="3.5" rx="1.75" fill="#f0a640"/>

    <!-- Distribution bus to target builds -->
    <line x1="638" y1="96" x2="650" y2="96" stroke="#3e4554" stroke-width="1.1"/>
    <line x1="650" y1="56" x2="650" y2="146" stroke="#3e4554" stroke-width="1.1"/>
    <line x1="650" y1="56" x2="662" y2="56" stroke="#3e4554" stroke-width="1.1"/>
    <rect x="662" y="39" width="150" height="34" rx="6" fill="#11141c" stroke="#232833" stroke-width="1"/>
    <circle cx="677" cy="56" r="3" fill="#f0a640"/>
    <text x="688" y="59.5" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="500" fill="#f3f4f6">Web · Edge Proxy</text>
    <line x1="650" y1="101" x2="662" y2="101" stroke="#3e4554" stroke-width="1.1"/>
    <rect x="662" y="84" width="150" height="34" rx="6" fill="#11141c" stroke="#1b2029" stroke-width="1"/>
    <circle cx="677" cy="101" r="3" fill="#6c7482"/>
    <text x="688" y="104.5" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="500" fill="#9ca3af">Android TV · .apk</text>
    <line x1="650" y1="146" x2="662" y2="146" stroke="#3e4554" stroke-width="1.1"/>
    <rect x="662" y="129" width="150" height="34" rx="6" fill="#11141c" stroke="#1b2029" stroke-width="1"/>
    <circle cx="677" cy="146" r="3" fill="#6c7482"/>
    <text x="688" y="149.5" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="500" fill="#9ca3af">webOS · Tizen</text>
  </g>
</svg>
