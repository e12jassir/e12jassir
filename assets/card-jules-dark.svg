<svg xmlns="http://www.w3.org/2000/svg" width="414" height="248" viewBox="0 0 414 248" role="img" aria-label="Jules — Resident cognitive AI service for Linux">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d4557" stop-opacity="0"/>
      <stop offset="22%" stop-color="#3d4557" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#3d4557" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3d4557" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="julesGlow" cx="0.5" cy="0.14" r="0.58">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="414" height="248" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="413" height="247" rx="13" fill="url(#bg)" stroke="#232833" stroke-width="1"/>
    <rect width="414" height="248" fill="url(#julesGlow)"/>
    <line x1="18" y1="1.2" x2="396" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Upper cognitive daemon pipeline stage -->
    <rect x="18" y="18" width="378" height="102" rx="9" fill="#090b0f" stroke="#1f242e" stroke-width="1"/>
    <circle cx="32" cy="33" r="3" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="41" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="700" letter-spacing="1.3" fill="#fbbf24">DAEMON</text>
    <text x="382" y="36" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#6c7482">/run/jules.sock</text>

    <!-- 3-node architecture flow -->
    <rect x="30" y="50" width="84" height="24" rx="5" fill="#11141c" stroke="#232833" stroke-width="1"/>
    <text x="72" y="65.5" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#9ca3af">Sanitizer</text>

    <line x1="114" y1="62" x2="132" y2="62" stroke="#3e4554" stroke-width="1.2"/>
    <path d="M129 59.5 L133 62 L129 64.5" fill="none" stroke="#3e4554" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="134" y="50" width="124" height="24" rx="5" fill="#11141c" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1"/>
    <text x="196" y="65.5" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="500" fill="#f3f4f6">LanceDB + Ctx</text>

    <line x1="258" y1="62" x2="276" y2="62" stroke="#3e4554" stroke-width="1.2"/>
    <path d="M273 59.5 L277 62 L273 64.5" fill="none" stroke="#3e4554" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="278" y="50" width="106" height="24" rx="5" fill="#11141c" stroke="#232833" stroke-width="1"/>
    <text x="331" y="65.5" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#9ca3af">Smart Router</text>

    <!-- Non-blocking async background path -->
    <path d="M331 74 L331 99 L302 99" fill="none" stroke="#3e4554" stroke-width="1.1" stroke-dasharray="2.5 2.5"/>
    <circle cx="302" cy="99" r="2" fill="#fbbf24"/>
    <text x="30" y="102" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9">
      <tspan fill="#fbbf24" font-weight="600">0ms block</tspan><tspan fill="#6c7482">&#160;&#160;&#x00b7;&#160;&#160;async score &#x2192; embed &#x2192; WAL</tspan>
    </text>

    <!-- Lower editorial -->
    <text x="22" y="146" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" letter-spacing="1.3" fill="#6c7482">
      <tspan fill="#fbbf24" font-weight="600">03</tspan>&#160;&#160;/&#160;&#160;AI DAEMON
    </text>
    <path d="M380 146 L390 136 M382 136 L390 136 L390 144" fill="none" stroke="#6c7482" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="22" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" letter-spacing="-0.4" fill="#f3f4f6">Jules</text>
    <text x="22" y="197" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9ca3af">Resident cognitive AI service and OS layer for Linux.</text>

    <line x1="22" y1="214" x2="392" y2="214" stroke="#1b2029" stroke-width="1"/>
    <text x="22" y="234" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#6c7482">UNIX Socket IPC&#160;&#160;&#x00b7;&#160;&#160;Local STT/TTS&#160;&#160;&#x00b7;&#160;&#160;450+ Tests</text>
  </g>
</svg>
