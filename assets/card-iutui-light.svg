<svg xmlns="http://www.w3.org/2000/svg" width="848" height="214" viewBox="0 0 848 214" role="img" aria-label="iutui — Keyboard-first YouTube client in the terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fb"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="22%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="78%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="iutuiGlow" cx="0.85" cy="0.18" r="0.45">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="848" height="214" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="847" height="213" rx="13" fill="url(#bg)" stroke="#d5dce5" stroke-width="1"/>
    <rect width="848" height="214" fill="url(#iutuiGlow)"/>
    <line x1="24" y1="1.2" x2="824" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Left editorial -->
    <text x="30" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="500" letter-spacing="1.4" fill="#64748b">
      <tspan fill="#0284c7" font-weight="600">01</tspan>&#160;&#160;/&#160;&#160;MEDIA TUI
    </text>
    <path d="M374 36 L384 26 M376 26 L384 26 L384 34" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="30" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#0f172a">iutui</text>

    <text x="30" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Keyboard-first YouTube client in the terminal.</text>
    <text x="30" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">Sub-3s playback, inline HD thumbnails, local</text>
    <text x="30" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569">RSS subscriptions, SponsorBlock, synced lyrics.</text>

    <line x1="30" y1="164" x2="384" y2="164" stroke="#e4e8ef" stroke-width="1"/>
    <text x="30" y="188" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="400" fill="#64748b">mpv IPC&#160;&#160;&#x00b7;&#160;&#160;Kitty HD&#160;&#160;&#x00b7;&#160;&#160;LRCLIB&#160;&#160;&#x00b7;&#160;&#160;No Account</text>

    <!-- Right miniature TUI stage -->
    <rect x="410" y="20" width="416" height="174" rx="10" fill="#f1f4f8" stroke="#dce2ea" stroke-width="1"/>
    <line x1="410" y1="44" x2="826" y2="44" stroke="#e4e8ef" stroke-width="1"/>
    <text x="424" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="600" fill="#0284c7">Home</text>
    <line x1="424" y1="43" x2="448" y2="43" stroke="#0284c7" stroke-width="1.5"/>
    <text x="464" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">Music</text>
    <text x="508" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">Subs</text>
    <text x="548" y="36" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">History</text>
    <text x="812" y="36" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" fill="#64748b">720p &#x00b7; mpv IPC</text>

    <!-- Mini sidebar -->
    <rect x="422" y="54" width="82" height="92" rx="6" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/>
    <rect x="428" y="65" width="2.5" height="11" rx="1.2" fill="#0284c7"/>
    <rect x="435" y="68" width="54" height="5" rx="2" fill="#475569" fill-opacity="0.7"/>
    <rect x="433" y="87" width="48" height="4.5" rx="2" fill="#94a3b8" fill-opacity="0.6"/>
    <rect x="433" y="106" width="52" height="4.5" rx="2" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="433" y="125" width="42" height="4.5" rx="2" fill="#94a3b8" fill-opacity="0.45"/>

    <!-- 2x2 feed tiles -->
    <rect x="514" y="54" width="146" height="42" rx="6" fill="#ffffff" stroke="#0284c7" stroke-opacity="0.7" stroke-width="1"/>
    <rect x="520" y="61" width="46" height="28" rx="4" fill="#0284c7" fill-opacity="0.12"/>
      <path d="M540 71 L547 75 L540 79 Z" fill="#0284c7"/>
    <rect x="574" y="67" width="72" height="4.5" rx="2" fill="#0f172a" fill-opacity="0.75"/>
    <rect x="574" y="77" width="46" height="3.5" rx="1.75" fill="#64748b" fill-opacity="0.45"/>
    <rect x="668" y="54" width="146" height="42" rx="6" fill="#ffffff" stroke="#e4e8ef" stroke-opacity="1" stroke-width="1"/>
    <rect x="674" y="61" width="46" height="28" rx="4" fill="#e4e8ef" fill-opacity="0.65"/>
    <rect x="728" y="67" width="72" height="4.5" rx="2" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="728" y="77" width="46" height="3.5" rx="1.75" fill="#64748b" fill-opacity="0.45"/>
    <rect x="514" y="104" width="146" height="42" rx="6" fill="#ffffff" stroke="#e4e8ef" stroke-opacity="1" stroke-width="1"/>
    <rect x="520" y="111" width="46" height="28" rx="4" fill="#e4e8ef" fill-opacity="0.65"/>
    <rect x="574" y="117" width="72" height="4.5" rx="2" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="574" y="127" width="46" height="3.5" rx="1.75" fill="#64748b" fill-opacity="0.45"/>
    <rect x="668" y="104" width="146" height="42" rx="6" fill="#ffffff" stroke="#e4e8ef" stroke-opacity="1" stroke-width="1"/>
    <rect x="674" y="111" width="46" height="28" rx="4" fill="#e4e8ef" fill-opacity="0.65"/>
    <rect x="728" y="117" width="72" height="4.5" rx="2" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="728" y="127" width="46" height="3.5" rx="1.75" fill="#64748b" fill-opacity="0.45"/>

    <!-- Bottom now-playing transport bar -->
    <rect x="422" y="156" width="392" height="28" rx="6" fill="#ffffff" stroke="#e4e8ef" stroke-width="1"/>
    <path d="M433 166 L440 170 L433 174 Z" fill="#0284c7"/>
    <text x="445" y="173" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9" font-weight="600" fill="#0f172a">mpv</text>
    <rect x="476" y="168" width="190" height="4" rx="2" fill="#e4e8ef"/>
    <rect x="476" y="168" width="118" height="4" rx="2" fill="#0284c7"/>
    <circle cx="594" cy="170" r="3" fill="#0284c7"/>
    <text x="804" y="173" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" fill="#64748b">[L] Lyrics &#x00b7; [B] Skip</text>
  </g>
</svg>
