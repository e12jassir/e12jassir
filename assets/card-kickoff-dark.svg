<svg xmlns="http://www.w3.org/2000/svg" width="414" height="196" viewBox="0 0 414 196" role="img" aria-label="kickoff — Live football scoreboard built for the terminal.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131922"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="topSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a4659" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3a4659" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#3a4659" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a4659" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cornerGlow" cx="0.92" cy="0.08" r="0.55">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect width="414" height="196" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0.5" y="0.5" width="413" height="195" rx="12" fill="url(#bg)" stroke="#222a36" stroke-width="1"/>
    <rect width="414" height="196" fill="url(#cornerGlow)"/>
    <line x1="16" y1="1.2" x2="398" y2="1.2" stroke="url(#topSheen)" stroke-width="1"/>

    <!-- Header -->
    <rect x="22" y="22" width="32" height="32" rx="8" fill="#161e29" stroke="#263142" stroke-width="1"/>
    <circle cx="38" cy="38" r="7" fill="none" stroke="#f0f6fc" stroke-opacity="0.65" stroke-width="1.4"/>
    <line x1="38" y1="31" x2="38" y2="45" stroke="#f0f6fc" stroke-opacity="0.65" stroke-width="1.2"/>
    <circle cx="38" cy="38" r="2.2" fill="#2dd4bf"/>
    <text x="66" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="600" letter-spacing="-0.3" fill="#f0f6fc">kickoff</text>

    <!-- Category pill & link arrow -->
    <rect x="268" y="27" width="99" height="22" rx="6" fill="#141b25" stroke="#242e3d" stroke-width="1"/>
    <text x="317.5" y="41.5" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" font-weight="500" letter-spacing="1.0" fill="#6c7684">LIVE SCORES</text>
    <path d="M378 43 L388 33 M380 33 L388 33 L388 41" fill="none" stroke="#6c7684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Description -->
    <text x="22" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#919ba8">Live football scoreboard built for the terminal.</text>
    <text x="22" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#919ba8">Timelines, team stats, lineups, ~28 MB memory.</text>

    <!-- Footer -->
    <line x1="22" y1="144" x2="392" y2="144" stroke="#1c232e" stroke-width="1"/>
    <text x="22" y="171" font-family="ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="400" letter-spacing="0.2">
      <tspan fill="#2dd4bf" font-weight="600">02</tspan><tspan fill="#6c7684">&#160;&#160;&#x00b7;&#160;&#160;15s Live Sync · mpv · Cross-Platform</tspan>
    </text>
  </g>
</svg>
